<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>QuickType</title>
  <link rel="stylesheet" href="overlay.css">
</head>
<body>
  <div class="hud-container" id="hudContainer">
    <div class="hud-header">
      <div class="hud-drag" id="hudDrag">
        <span class="hud-dot"></span>
        <span class="hud-title">QuickType</span>
      </div>
      <div class="hud-status" id="hudStatus">Готов</div>
    </div>

    <div class="input-wrapper">
      <input 
        type="text" 
        id="inputText" 
        class="hud-input" 
        placeholder="Введите текст или команду..." 
        autocomplete="off" 
        spellcheck="false" 
        autofocus
      />
    </div>

    <div class="hud-footer">
      <span class="shortcut-hint"><kbd>Enter</kbd> — Отправить и скрыть</span>
      <span class="shortcut-hint"><kbd>Esc</kbd> — Отмена</span>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="overlay.js"></script>
</body>
</html>
